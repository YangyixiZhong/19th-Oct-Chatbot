<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit — AI chat</title>
  <meta name="description" content="Orbit is a friendly general-purpose AI chatbot.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/robot.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { var t = localStorage.getItem('orbit-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#prompt">Skip to message box</a>

  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand__dot" aria-hidden="true"></span>ORBIT</div>
      <div class="topbar__actions">
        <button class="btn btn--ghost" id="newChat" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
          New chat
        </button>
        <button class="btn btn--icon" id="themeToggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="scene" aria-label="Orbit the robot">
        <div class="scene__stage">
          <div class="bubble" id="greeting">
            <span class="bubble__label">ORBIT://HELLO</span>
            Hey, I’m Orbit. What’s on your mind?
          </div>
          <img class="robot" src="assets/robot.png" width="800" height="800" alt="Orbit, a friendly pixel-art robot waving hello">
          <div class="scene__shadow" aria-hidden="true"></div>
        </div>
        <ul class="scene__tags" aria-hidden="true">
          <li class="tag tag--lime">ASK ANYTHING</li>
          <li class="tag tag--blue">WRITE · BRAINSTORM</li>
          <li class="tag tag--coral">EXPLAIN</li>
        </ul>
      </section>

      <section class="chat" aria-label="Chat with Orbit">
        <div class="chat__scroll" id="scroller">
          <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
            <div class="empty" id="empty">
              <p class="mono-label">TRY ONE OF THESE</p>
              <div class="chips" id="chips">
                <button class="chip" type="button" data-prompt="Explain how black holes work in simple terms.">Explain black holes simply</button>
                <button class="chip" type="button" data-prompt="Brainstorm 10 creative names for a small coffee shop.">Brainstorm coffee shop names</button>
                <button class="chip" type="button" data-prompt="Write a short, friendly email asking my landlord to fix a leaking tap.">Write a polite email</button>
                <button class="chip" type="button" data-prompt="Give me a simple 3-day plan to start learning guitar.">Plan: learn guitar</button>
              </div>
            </div>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="prompt">Message Orbit</label>
          <textarea id="prompt" rows="1" maxlength="2000" placeholder="Message Orbit…" enterkeyhint="send"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
          <div class="composer__meta mono-label">
            <span>ENTER to send · SHIFT+ENTER for new line</span>
            <span id="count" aria-hidden="true">0 / 2000</span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
